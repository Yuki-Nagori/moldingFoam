# CD for moldingFoam: manually dispatched release. The tag is typed at
# trigger time; the workflow re-runs the full acceptance and assembles
# the self-contained bundle on BOTH amd64 and arm64, then writes the tag
# at the selected commit and publishes one GitHub release with both
# bundles attached.

name: CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (written at the selected commit)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::invalid tag '$TAG' (expected e.g. v1.2 or v1.2.3)"
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release '$TAG' already exists"
            exit 1
          fi

  build:
    name: build / ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ libopenmpi-dev openmpi-bin python3 curl ca-certificates

      - name: Install OpenFOAM-14 (official binary)
        run: |
          curl -fsSL https://dl.openfoam.org/gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/openfoam.asc >/dev/null
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openfoam14

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build, model tests and contract case
        env:
          MOLDINGFOAM_PARALLEL: "4"
        run: |
          xmake
          xmake run test
          xmake run case-contract

      - name: Assemble self-contained bundle
        run: xmake run bundle

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/moldingFoam-openfoam14-*.tar.xz dist/

      - uses: actions/upload-artifact@v4
        with:
          name: moldingFoam-bundle-${{ matrix.arch }}
          path: dist/*.tar.xz
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: moldingFoam-bundle-*
          merge-multiple: true
          path: dist

      - name: Create release and write tag
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--generate-notes)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "moldingFoam $TAG" "${FLAGS[@]}" dist/*.tar.xz
