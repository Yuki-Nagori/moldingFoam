# Nightly full-system regression. Each block runs as an independent job so
# a failure is scoped to a single, short log; the report job opens or
# comments on a tracking issue listing the failed jobs. The per-PR CI
# keeps only the build + model tests.

name: nightly

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 6:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Model tests
        run: xmake run test

  solver-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Solver feature cases
        run: |
          set -o pipefail
          xmake run test-solver 2>&1 | tee test-solver.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-solver-cases
          path: test-solver.txt
          retention-days: 14

  validation-thermal-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Flow and thermal validations
        run: |
          set -o pipefail
          xmake run couette 2>&1 | tee couette.txt
          xmake run couetteSlip 2>&1 | tee couetteSlip.txt
          xmake run stefan 2>&1 | tee stefan.txt
          xmake run anisoConduction 2>&1 | tee anisoConduction.txt
          xmake run anisoViscosity 2>&1 | tee anisoViscosity.txt
          xmake run restartContinuity 2>&1 | tee restartContinuity.txt
          xmake run reviewRegression 2>&1 | tee reviewRegression.txt
          xmake run thermoelastic 2>&1 | tee thermoelastic.txt
          xmake run coolantWater 2>&1 | tee coolantWater.txt
          xmake run coolantMold 2>&1 | tee coolantMold.txt
          xmake run highPressure 2>&1 | tee highPressure.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-thermal-flow-logs
          path: |
            *.txt
            validation/stefan/log.foamRun
            validation/anisoConduction/log.foamRun
            validation/anisoViscosity/log.foamRun
            validation/restartContinuity/log.foamRun
            build/reviewRegression/**/log.*
            validation/thermoelastic/log.foamRun
            validation/coolantWater/log.foamRun
            validation/coolantMold/log.foamRun
            validation/highPressure/log.foamRun
          retention-days: 14

  validation-structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Structural validations
        run: |
          set -o pipefail
          xmake run warpageAniso 2>&1 | tee warpageAniso.txt
          xmake run warpagePlate 2>&1 | tee warpagePlate.txt
          xmake run shrinkBar 2>&1 | tee shrinkBar.txt
          xmake run anisoShrinkBar 2>&1 | tee anisoShrinkBar.txt
          xmake run eigenstrainGraded 2>&1 | tee eigenstrainGraded.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-structural-logs
          path: |
            *.txt
            validation/warpageAniso/log.foamRun
            validation/warpagePlate/log.foamRun
            validation/shrinkBar/log.run
            validation/anisoShrinkBar/log.run
            validation/eigenstrainGraded/log.run
          retention-days: 14

  validation-cht:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Conjugate heat transfer validation
        run: |
          set -o pipefail
          xmake run moldCHT 2>&1 | tee moldcht.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-cht-logs
          path: |
            moldcht.txt
            validation/moldCHT/log.foamRun
            validation/moldCHT-cycle/log.foamRun
            validation/moldCHT-fill/log.foamRun
            validation/moldCHT-cooled/log.foamRun
            validation/moldCHT-lumped/log.foamRun
            validation/coolantWaterMold/log.foamRun
          retention-days: 14

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MOLDINGFOAM_PARALLEL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Contract case (4 subdomains)
        run: |
          set -o pipefail
          xmake run case-contract 2>&1 | tee acceptance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-contract-logs
          path: |
            acceptance.txt
            case-contract/log.foamRun
            case-contract/log.blockMesh
          retention-days: 14

  exit-path-smoke:
    # Scope the exit-path smoke test (task 037/042) as its own job: the VM
    # passes it on this very case, but the first CI run failed with an empty
    # log - the raw log is needed to identify the environment difference, so
    # the failure stays visible without failing the contract verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Exit-path smoke test
        run: |
          set -o pipefail
          # The other steps reach OpenFOAM through xmake; a plain script
          # invocation must source the environment itself. Without it the
          # script's blockMesh/foamRun are "command not found", which
          # set -e turns into a silent early exit (observed: empty log on
          # the first CI run, run 34766029612).
          source /opt/openfoam14/etc/bashrc
          bash scripts/smoke-exit.sh case-contract 2>&1 | tee smoke-exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-exit-path-logs
          path: smoke-exit.txt
          retention-days: 14

  cycle-restart:
    # Task 064: exercise the dedicated two-way decomposition and cycle-state
    # verifier nightly; this remains outside the per-PR budget.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Multi-cycle checkpoint contract (2 subdomains)
        run: |
          set -o pipefail
          source /opt/openfoam14/etc/bashrc
          bash scripts/run-case.sh tests/cases/moldCycles 2 2>&1 | tee moldCycles.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-cycle-restart-logs
          path: |
            moldCycles.txt
            tests/cases/moldCycles/log.*
            tests/cases/moldCycles/postProcessing/**
          retention-days: 14

  uncertainty-manifest:
    # Keep the task-069 matrix definition executable and reviewable nightly.
    # The actual nine-row solve is intentionally resource-governed by the
    # nightly orchestrator rather than by a developer workstation.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Emit uncertainty matrix manifest
        run: scripts/uncertainty-matrix.sh --emit | tee uncertainty-matrix.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-uncertainty-matrix
          path: uncertainty-matrix.tsv
          retention-days: 14

  report:
    needs:
      - model-tests
      - solver-cases
      - validation-thermal-flow
      - validation-structural
      - validation-cht
      - contract
      - exit-path-smoke
      - cycle-restart
      - uncertainty-manifest
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Open or comment the failure issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          FAILED=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result == "failure") | .key' \
            | paste -sd, -)
          TITLE="nightly FAILED $(date -u +%Y-%m-%d)"
          BODY="Failed jobs: ${FAILED}

          Open the failed job in the run and its uploaded artifact
          (nightly-*-logs); the job log is scoped to that block."
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" \
            --search "$TITLE in:title" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
