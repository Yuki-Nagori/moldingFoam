# CD for moldingFoam: manually dispatched release. The tag is typed at
# trigger time; the workflow re-runs the full acceptance and assembles
# the self-contained bundle on BOTH amd64 and arm64, then writes the tag
# at the selected commit and publishes one GitHub release with both
# bundles attached.

name: CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (written at the selected commit)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::invalid tag '$TAG' (expected e.g. v1.2 or v1.2.3)"
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release '$TAG' already exists"
            exit 1
          fi

  build:
    name: build / ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Model tests
        run: xmake run test

      - name: Set the release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sed -i "s/^local MOLDINGFOAM_VERSION = .*/local MOLDINGFOAM_VERSION = \"$TAG\";/" xmake.lua
          grep -n "MOLDINGFOAM_VERSION" xmake.lua

      - name: Assemble self-contained bundle
        env:
          # The archive name carries the release tag and the architecture
          # instead of a date (a day may carry several releases)
          MOLDINGFOAM_ARCH: ${{ matrix.arch }}
        run: xmake run bundle

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/moldingFoam-*.tar.xz dist/

      - uses: actions/upload-artifact@v4
        with:
          name: moldingFoam-bundle-${{ matrix.arch }}
          path: dist/*.tar.xz
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: moldingFoam-bundle-*
          merge-multiple: true
          path: dist

      - name: Create release and write tag
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--generate-notes)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "moldingFoam $TAG" "${FLAGS[@]}" dist/*.tar.xz
