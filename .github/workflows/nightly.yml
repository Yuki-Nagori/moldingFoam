# Nightly full-system regression. Each block runs as an independent job so
# a failure is scoped to a single, short log; the report job opens or
# comments on a tracking issue listing the failed jobs. The per-PR CI
# keeps only the build + model tests.

name: nightly

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 6:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Model tests
        run: xmake run test

  solver-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Solver feature cases
        run: |
          set -o pipefail
          xmake run test-solver 2>&1 | tee test-solver.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-solver-cases
          path: test-solver.txt
          retention-days: 14

  validation-thermal-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Flow and thermal validations
        run: |
          set -o pipefail
          xmake run couette 2>&1 | tee couette.txt
          xmake run couetteSlip 2>&1 | tee couetteSlip.txt
          xmake run stefan 2>&1 | tee stefan.txt
          xmake run thermoelastic 2>&1 | tee thermoelastic.txt
          xmake run coolantWater 2>&1 | tee coolantWater.txt
          xmake run coolantMold 2>&1 | tee coolantMold.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-thermal-flow-logs
          path: |
            *.txt
            validation/stefan/log.foamRun
            validation/thermoelastic/log.foamRun
            validation/coolantWater/log.foamRun
            validation/coolantMold/log.foamRun
          retention-days: 14

  validation-structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Structural validations
        run: |
          set -o pipefail
          xmake run warpageAniso 2>&1 | tee warpageAniso.txt
          xmake run warpagePlate 2>&1 | tee warpagePlate.txt
          xmake run shrinkBar 2>&1 | tee shrinkBar.txt
          xmake run anisoShrinkBar 2>&1 | tee anisoShrinkBar.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-structural-logs
          path: |
            *.txt
            validation/warpageAniso/log.foamRun
            validation/warpagePlate/log.foamRun
            validation/shrinkBar/log.run
            validation/anisoShrinkBar/log.run
          retention-days: 14

  validation-cht:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Conjugate heat transfer validation
        run: |
          set -o pipefail
          xmake run moldCHT 2>&1 | tee moldcht.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-cht-logs
          path: |
            moldcht.txt
            validation/moldCHT/log.foamRun
            validation/moldCHT-cycle/log.foamRun
            validation/moldCHT-fill/log.foamRun
            validation/moldCHT-cooled/log.foamRun
            validation/moldCHT-lumped/log.foamRun
            validation/coolantWaterMold/log.foamRun
          retention-days: 14

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MOLDINGFOAM_PARALLEL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Contract case (4 subdomains)
        run: |
          set -o pipefail
          xmake run case-contract 2>&1 | tee acceptance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-contract-logs
          path: |
            acceptance.txt
            case-contract/log.foamRun
            case-contract/log.blockMesh
          retention-days: 14

  report:
    needs:
      - model-tests
      - solver-cases
      - validation-thermal-flow
      - validation-structural
      - validation-cht
      - contract
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Open or comment the failure issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          FAILED=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result == "failure") | .key' \
            | paste -sd, -)
          TITLE="nightly FAILED $(date -u +%Y-%m-%d)"
          BODY="Failed jobs: ${FAILED}

          Open the failed job in the run and its uploaded artifact
          (nightly-*-logs); the job log is scoped to that block."
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" \
            --search "$TITLE in:title" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
