# CI for moldingFoam: build against the official OpenFOAM-14 binary on
# both amd64 and arm64, run the model tests and the contract case
# acceptance.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ libopenmpi-dev openmpi-bin python3 curl ca-certificates

      - name: Install OpenFOAM-14 (official binary)
        run: |
          curl -fsSL https://dl.openfoam.org/gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/openfoam.asc >/dev/null
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openfoam14

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: xmake

      - name: Model tests
        run: xmake run test

      - name: Contract case (4 subdomains)
        env:
          MOLDINGFOAM_PARALLEL: "4"
        run: xmake run case-contract
